name: Release Gate

# Pre-merge check for the `main` -> `release` PR (ADR-0009). Fails, one line per
# problem, when the version this PR would release is not cleanly publishable:
# packages off lockstep, invalid semver, tag v<version> already present (locally
# or on origin), any package already on npm at that version, or no CHANGELOG
# heading for it. ci.yml still runs the full `pnpm qa` gate on the same PR.
# Logic + tests: scripts/release-gate.mjs, scripts/release-gate.test.mjs.
on:
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # The gate is zero-dependency (Node built-ins + git + npm), so no install.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Unit-test the gate
        run: node --test scripts/release-gate.test.mjs
      - name: Run the release gate
        run: node scripts/release-gate.mjs
